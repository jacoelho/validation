name: Validation refactor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-matrix:
    name: ${{ matrix.platform }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            go: '1.27.0'
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            go: '1.27.0'
          - runner: macos-15
            platform: darwin/arm64
            go: '1.27.0'
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Confirm native compiler and platform
        shell: bash
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = '${{ matrix.platform }}'
          test "$(go version | awk '{print $3}')" = 'go${{ matrix.go }}'
          go version
          go env GOOS GOARCH
      - name: Run and record native verification gates
        run: python3 tools/record_native_gates.py --output '${{ runner.temp }}/native-gates.json'
      - name: Record native acceptance evidence
        run: |
          python3 tools/record_acceptance.py \
            --local-only \
            --native-gates '${{ runner.temp }}/native-gates.json' \
            --output '${{ runner.temp }}/acceptance-report.json'
      - name: Upload native verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/native-gates.json
            ${{ runner.temp }}/acceptance-report.json
            testdata/fuzz/**
          if-no-files-found: error

  release-gate:
    needs: native-matrix
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: acceptance-*
          path: ${{ runner.temp }}/reports
      - name: Verify current-revision native evidence
        run: |
          python3 tools/record_acceptance.py \
            --aggregate-only \
            --matrix-record '${{ runner.temp }}/reports/acceptance-ubuntu-24.04/acceptance-report.json' \
            --matrix-record '${{ runner.temp }}/reports/acceptance-ubuntu-24.04-arm/acceptance-report.json' \
            --matrix-record '${{ runner.temp }}/reports/acceptance-macos-15/acceptance-report.json' \
            --output '${{ runner.temp }}/release-report.json'
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-release
          path: ${{ runner.temp }}/release-report.json
          if-no-files-found: error
