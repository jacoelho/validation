# Run with a golangci-lint binary built using Go 1.27 or newer.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - ineffassign
    - unused
    - iface
    - dupl
    - dogsled
    - forbidigo
    - funlen
    - gocritic
    - goconst
    - gocognit
    - cyclop
    - nestif
    - maintidx
    - unparam
    - errorlint
    - nilerr
    - nilnil
    - nilnesserr
    - wastedassign
    - forcetypeassert
    - bodyclose
    - nolintlint
    - exhaustive
    - gosec
    - ireturn
    - interfacebloat
    - copyloopvar
    - nakedret
    - contextcheck
    - reassign
    - makezero
    - modernize
    - noctx
    - recvcheck
    - unconvert
    - asciicheck
    - bidichk
    - depguard
    - dupword
    - durationcheck
    - errchkjson
    - gocheckcompilerdirectives
    - gochecknoinits
    - godoclint
    - gomoddirectives
    - goprintffuncname
    - inamedparam
    - intrange
    - iotamixing
    - mirror
    - misspell
    - musttag
    - nosprintfhostport
    - testableexamples
    - thelper
    - tparallel
    - usestdlibvars
    - usetesting

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment

    errcheck:
      check-blank: true
      check-type-assertions: true

    exhaustive:
      default-signifies-exhaustive: true

    nilnil:
      detect-opposite: true

    reassign:
      patterns:
        - ".*"

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation: []

    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/jacoelho/validation$

    revive:
      enable-default-rules: false
      rules:
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"
        - name: context-keys-type
        - name: dot-imports
        - name: empty-lines
        - name: error-return
        - name: error-strings
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-branches
        - name: identical-switch-conditions
        - name: if-return
        - name: increment-decrement
        - name: modifies-value-receiver
        - name: package-comments
        - name: superfluous-else
          arguments:
            - preserve-scope
        - name: time-naming
        - name: unchecked-type-assertion
        - name: unexported-return
        - name: unnecessary-if
        - name: var-declaration
        - name: var-naming

    iface:
      enable:
        - identical
        - unused
        - opaque
        - unexported

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic

    dupl:
      threshold: 120

    dogsled:
      max-blank-identifiers: 1

    gocognit:
      min-complexity: 50

    cyclop:
      max-complexity: 35

    gocritic:
      disabled-checks:
        - dupSubExpr
      enabled-checks:
        - boolExprSimplify
        - commentedOutImport
        - deferUnlambda
        - dupImport
        - emptyFallthrough
        - emptyStringTest
        - exposedSyncMutex
        - hexLiteral
        - httpNoBody
        - methodExprCall
        - octalLiteral
        - preferFilepathJoin
        - redundantSprint
        - regexpSimplify
        - stringConcatSimplify
        - stringsCompare
        - timeExprSimplify
        - typeAssertChain
        - typeUnparen
        - unlabelStmt
        - unnecessaryBlock
        - whyNoLint
        - yodaStyleExpr

    funlen:
      lines: 120
      statements: 70
      ignore-comments: true

    nestif:
      min-complexity: 15

    maintidx:
      under: 25

  exclusions:
    rules:
      # Traversal inspects each immediate error-tree node and preserves identity.
      - path: ^error(_internal_test)?\.go$
        linters:
          - errorlint
      # These tests assert exact reported error identity, not cause membership.
      - path: ^(error|rule)_test\.go$
        linters:
          - errorlint
        text: "comparing with !="
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - goconst
          - funlen
          - nestif
          - dupl
          - maintidx
          - dogsled
          - errcheck
          - gosec
      - path: _test\.go
        text: "unused-parameter:"
        linters:
          - revive
      - path: _test\.go
        linters:
          - govet
        text: "fieldalignment"
      - path: _test\.go
        linters:
          - govet
        text: "shadow:"
